<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Grudge Art Online</title>

<style>
body {
    background:#050505;
    color:#00ff41;
    font-family:'Courier New', monospace;
    margin:0;
    height:100vh;
    display:grid;
    grid-template-columns:70% 30%;
    overflow:hidden;
    text-shadow:0 0 5px #00ff41;
}

/* scanlines */
body::after{
    content:"";
    position:absolute;
    inset:0;
    background:
      linear-gradient(rgba(18,16,16,0) 50%, rgba(0,0,0,0.25) 50%),
      linear-gradient(90deg, rgba(255,0,0,0.05), rgba(0,255,0,0.02), rgba(0,0,255,0.05));
    background-size:100% 2px,3px 100%;
    pointer-events:none;
}

/* LEFT PANEL */
#main-console{
    border-right:2px solid #00ff41;
    display:flex;
    flex-direction:column;
    height:100vh;
}

/* header fixed */
#header{
    padding:15px 20px;
    border-bottom:1px solid #00ff41;
}

/* scroll area */
#chat-box{
    flex:1;
    overflow-y:auto;
    padding:20px;
}

/* input fixed */
#input-area{
    border-top:1px solid #00ff41;
    display:flex;
}

/* message rows */
.msg-row{display:flex;width:100%;}
.msg-row.system{justify-content:flex-start;}
.msg-row.user{justify-content:flex-end;}

.msg{
    border:1px solid #00ff41;
    padding:14px;
    margin:10px 0;
    background:rgba(0,255,65,0.05);
    max-width:70%;
    position:relative;
}

.msg.system{color:#00ff41;}
.msg.user{color:#fff;border-color:#fff;}

.msg::before{
    position:absolute;
    top:-9px;
    background:#050505;
    padding:0 6px;
    font-size:0.7em;
}
.msg.system::before{content:"SYSTEM";left:10px;}
.msg.user::before{content:"YOU";right:10px;}

/* input */
input{
    flex:1;
    background:#000;
    border:none;
    color:#fff;
    padding:15px;
    font-family:inherit;
    outline:none;
}
button{
    background:#00ff41;
    border:none;
    padding:0 30px;
    font-weight:bold;
    cursor:pointer;
}

/* RIGHT PANEL */
#side-panel{
    padding:20px;
    background:#0a0a0a;
    height:100vh;
    overflow:hidden;
}

.stat-box{
    border:1px solid #00ff41;
    padding:10px;
    margin-bottom:25px;
}

#meter-container{
    height:20px;
    background:#222;
    border:1px solid #00ff41;
    margin-top:10px;
}
#meter-fill{
    height:100%;
    width:0%;
    background:#00ff41;
    transition:.3s;
}
</style>
</head>

<body>

<div id="main-console">

<div id="header">
> CONNECTION ESTABLISHED: UID_<span id="uid-display"></span>
</div>

<div id="chat-box">
    <div class="msg-row system">
        <div class="msg system">
            Welcome to Grudge Art Online. Actions have consequences.
        </div>
    </div>
</div>

<div id="input-area">
    <input id="user-input" placeholder="Enter command..." autofocus>
    <button onclick="sendMessage()">SEND</button>
</div>

</div>

<div id="side-panel">
    <div class="stat-box">
        <h3>GLOBAL THREAT</h3>
        <div id="anger-text">0%</div>
        <div id="meter-container">
            <div id="meter-fill"></div>
        </div>
    </div>

    <div class="stat-box">
        <h3>LAST CRIME</h3>
        <div id="crime-log">None</div>
    </div>

    <div class="stat-box">
        <h3>BANNED</h3>
        <div id="ban-count">0</div>
    </div>
</div>

<script>
let userId = localStorage.getItem("user_id");
if(!userId){
    userId="Player_"+Math.floor(Math.random()*999);
    localStorage.setItem("user_id",userId);
}
document.getElementById("uid-display").innerText=userId;

async function sendMessage(){
    const input=document.getElementById("user-input");
    const text=input.value;
    if(!text) return;

    const chatBox=document.getElementById("chat-box");

    chatBox.innerHTML += `
    <div class="msg-row user">
        <div class="msg user">${text}</div>
    </div>`;

    input.value="";
    chatBox.scrollTop=chatBox.scrollHeight;

    try{
        const res=await fetch('/chat',{
            method:'POST',
            headers:{'Content-Type':'application/json'},
            body:JSON.stringify({message:text,user_id:userId})
        });
        const data=await res.json();

        chatBox.innerHTML += `
        <div class="msg-row system">
            <div class="msg system">${data.reply}</div>
        </div>`;

        chatBox.scrollTop=chatBox.scrollHeight;

        if(data.anger!==undefined) updateVisuals(data.anger);

    }catch{
        chatBox.innerHTML+=`
        <div class="msg-row system">
            <div class="msg system" style="border-color:red;color:red">
            CONNECTION LOST
            </div>
        </div>`;
    }
}

document.getElementById("user-input").addEventListener("keypress",e=>{
    if(e.key==="Enter") sendMessage();
});

async function fetchWorldState(){
    try{
        const res=await fetch('/status');
        const data=await res.json();

        document.getElementById("crime-log").innerText=data.last_crime;
        document.getElementById("ban-count").innerText=data.banned_count;
        updateVisuals(data.anger);
    }catch{}
}

function updateVisuals(anger){
    document.getElementById("meter-fill").style.width=anger+"%";
    document.getElementById("anger-text").innerText=anger+"%";
}

setInterval(fetchWorldState,2000);
</script>

</body>
</html>
